version: '3.8'

services:
  udp2tcp-server:
    build:
      context: ..    # project root (one level up from this compose file)
      dockerfile: server-udp-bridge/Dockerfile
    container_name: udp2tcp-server
    ports:
      - "2222:22"            # SSH access
      - "47000:47000"        # tcp_listen.port from udp2tcp_srv.yaml
      - "9108:9108"          # metrics (if enabled)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/opt/udp-bridge/logs
      - ./ssh_keys:/etc/ssh/keys:ro
      - ../third_party/udp2tcp/configs/udp2tcp_srv.yaml:/opt/udp-bridge/udp2tcp_srv.yaml:ro
    restart: unless-stopped
    networks:
      - udp-bridge-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "47000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  udp-bridge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
