[supervisord]
nodaemon=true
user=root
logfile=/opt/udp-bridge/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:sshd]
command=/usr/sbin/sshd -D
stdout_logfile=/opt/udp-bridge/logs/sshd.log
stderr_logfile=/opt/udp-bridge/logs/sshd_error.log
autorestart=true
priority=100

[program:udp-bridge-server]
command=/opt/udp-bridge/udp-bridge-server
directory=/opt/udp-bridge
stdout_logfile=/opt/udp-bridge/logs/udp-bridge.log
stderr_logfile=/opt/udp-bridge/logs/udp-bridge_error.log
autorestart=true
priority=200
environment=TARGET_UDP_HOST="%(ENV_TARGET_UDP_HOST)s",TARGET_UDP_PORT="%(ENV_TARGET_UDP_PORT)s",BRIDGE_TCP_PORT="%(ENV_BRIDGE_TCP_PORT)s",CLIENT_TIMEOUT="%(ENV_CLIENT_TIMEOUT)s",MAX_CLIENTS="%(ENV_MAX_CLIENTS)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
