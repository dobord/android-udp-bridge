name: Nightly Build

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      
    steps:
    - name: Checkout code (full history for change scan)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine change window & scan
      id: check
      run: |
        FORCE="${{ github.event.inputs.force_build }}"
        if [ "${FORCE}" = "true" ]; then
          echo "Force build requested via workflow_dispatch input"
          echo "should_build=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        CHANGED_COUNT=$(git log --since="24 hours ago" --name-only --pretty=format: | \
          grep -E '\\.(c|cpp|cxx|h|hpp|java|kt|gradle|sh)$' | grep -v '^$' | sort -u | wc -l || true)
        echo "Detected ${CHANGED_COUNT} changed source files in last 24h"
        if [ "${CHANGED_COUNT}" -gt 0 ]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
        else
          echo "should_build=false" >> $GITHUB_OUTPUT
        fi

  nightly-build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]
    
    steps:
    - name: Checkout code (full)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Optional fetch udp2tcp submodule (full recursive)
      run: |
        echo "Attempting full recursive fetch of udp2tcp submodule..."
        set +e
        git submodule update --init --recursive third_party/udp2tcp 2>&1
        status=$?
        if [ $status -ne 0 ]; then
          echo "⚠️  udp2tcp submodule fetch failed (status=$status); continuing in legacy mode."
        fi
        set -e
        if [ -d third_party/udp2tcp/include ]; then
          echo "✅ udp2tcp present"; git -C third_party/udp2tcp log --oneline -1 | head -1 || true
        else
          echo "ℹ️  udp2tcp not present; legacy path will be built." 
        fi
      
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
    - name: Install additional build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config
        sudo apt-get install -y autotools-dev autoconf automake libtool util-linux gh jq
        
    - name: Setup Android environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
    - name: Cache source packages
      uses: actions/cache@v4
      with:
        path: |
          ~/source_cache
        key: source-packages-v1-${{ hashFiles('build_openssl.sh') }}
        restore-keys: |
          source-packages-v1-
          
    - name: Pre-download sources with mirrors
      run: |
        echo "📥 Downloading sources using mirrors..."
        
        # Create directory for source cache
        mkdir -p ~/source_cache
        cd ~/source_cache
        
        # Function to download with mirrors
        download_with_mirrors() {
          local filename=$1
          local primary_url=$2
          local mirror_urls=("${@:3}")
          
          if [ -f "$filename" ]; then
            echo "✅ $filename already downloaded"
            return 0
          fi
          
          echo "⬇️ Downloading $filename..."
          
          # Try primary URL
          if wget -O "$filename.tmp" "$primary_url" 2>/dev/null; then
            mv "$filename.tmp" "$filename"
            echo "✅ Downloaded from primary: $primary_url"
            return 0
          fi
          
          # Try mirrors
          for mirror_url in "${mirror_urls[@]}"; do
            echo "🔄 Trying mirror: $mirror_url"
            if wget -O "$filename.tmp" "$mirror_url" 2>/dev/null; then
              mv "$filename.tmp" "$filename"
              echo "✅ Downloaded from mirror: $mirror_url"
              return 0
            fi
          done
          
          echo "❌ Failed to download $filename"
          rm -f "$filename.tmp"
          return 1
        }
        
        # Download OpenSSL with mirrors
        download_with_mirrors "openssl-3.5.0.tar.gz" \
          "https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz" \
          "https://www.openssl.org/source/openssl-3.5.0.tar.gz" \
          "https://ftp.openssl.org/source/openssl-3.5.0.tar.gz" \
          "https://mirror.yandex.ru/pub/OpenSSL/openssl-3.5.0.tar.gz"
        
        # Download libssh with mirrors
        download_with_mirrors "libssh-0.11.2.tar.xz" \
          "https://www.libssh.org/files/0.11/libssh-0.11.2.tar.xz" \
          "https://git.libssh.org/projects/libssh.git/snapshot/libssh-0.11.2.tar.xz" \
          "https://mirror.yandex.ru/debian/pool/main/libs/libssh/libssh_0.11.2.orig.tar.xz"
        
        echo "✅ Sources cached"
        ls -la ~/source_cache/
        
    - name: Build OpenSSL and libssh for ${{ matrix.arch }}
      run: |
        chmod +x ./build_openssl.sh
        export ANDROID_ABI=${{ matrix.arch }}
        export SOURCE_CACHE_DIR="$HOME/source_cache"
        ./build_openssl.sh
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
            
    - name: Build ${{ matrix.build_type }} APK for ${{ matrix.arch }}
      working-directory: ssh-tunnel-android-app
      run: |
        if [ "${{ matrix.build_type }}" = "debug" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace -PcmakeArgs=-DANDROID_ABI=${{ matrix.arch }}
        else
          ./gradlew assembleRelease --no-daemon --stacktrace -PcmakeArgs=-DANDROID_ABI=${{ matrix.arch }}
        fi
        
    - name: Run tests
      working-directory: ssh-tunnel-android-app
      run: ./gradlew test --no-daemon --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nightly-${{ matrix.build_type }}-${{ matrix.arch }}
        path: ssh-tunnel-android-app/app/build/outputs/apk/${{ matrix.build_type }}/app-${{ matrix.build_type }}.apk
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.build_type }}-${{ matrix.arch }}
        path: ssh-tunnel-android-app/app/build/test-results/

  create-nightly-release:
    needs: nightly-build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: nightly-*
        merge-multiple: false
        
    - name: Create nightly tag env var (not pushing tag)
      run: |
        DATE=$(date +'%Y%m%d')
        echo "NIGHTLY_TAG=nightly-$DATE" >> $GITHUB_ENV
        
    - name: Delete previous nightly release
      run: |
        gh release delete nightly-latest --yes || true
        git tag -d nightly-latest || true
        git push origin :refs/tags/nightly-latest || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create nightly release
      run: |
        DATE=$(date +'%Y-%m-%d %H:%M UTC')
        NOTES_FILE=nightly_notes.md
        {
          echo 'Nightly Build';
          echo;
          echo 'Automated nightly build containing the latest changes (potentially unstable).';
          echo;
          echo 'Included builds:';
          echo ' - Debug + Release APKs for arm64-v8a, armeabi-v7a, x86, x86_64';
          echo;
          echo 'Installation:';
          echo " 1. Enable 'Unknown sources'";
          echo ' 2. Install matching APK for your device architecture';
        } > "$NOTES_FILE"
        gh release create nightly-latest \
          --title "Nightly Build - $DATE" \
          --notes-file "$NOTES_FILE" \
          --prerelease \
          nightly-*/app-*.apk
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: [nightly-build, create-nightly-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.artifacts.filter(artifact => {
            const ageInDays = (Date.now() - new Date(artifact.created_at)) / (1000 * 60 * 60 * 24);
            return ageInDays > 7; // Remove artifacts older than 7 days
          });
          
          for (const artifact of oldArtifacts) {
            console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id
            });
          }
          
          console.log(`Deleted ${oldArtifacts.length} old artifacts`);

  notify:
    needs: [nightly-build, create-nightly-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify build status
      run: |
        if [ "${{ needs.nightly-build.result }}" == "success" ] && [ "${{ needs.create-nightly-release.result }}" == "success" ]; then
          echo "✅ Nightly build completed successfully"
          echo "🚀 Release available at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly-latest"
        else
          echo "❌ Nightly build failed"
          echo "🔍 Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
