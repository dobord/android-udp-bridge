name: Nightly Build

on:
  schedule:
    # Запуск каждый день в 2:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: Check for changes
      id: check
      run: |
        if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "Force build requested"
        else
          # Проверить изменения за последние 24 часа
          CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -E "\.(c|cpp|h|hpp|java|kt|gradle|sh)$" | wc -l)
          if [ $CHANGES -gt 0 ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Found $CHANGES code changes"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No significant changes found"
          fi
        fi

  nightly-build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
        arch: [arm64-v8a, armeabi-v7a]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
    - name: Install additional build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config
        sudo apt-get install -y autotools-dev autoconf automake libtool
        
    - name: Setup Android environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
    - name: Cache source packages
      uses: actions/cache@v4
      with:
        path: |
          ~/source_cache
        key: source-packages-v1-${{ hashFiles('build_openssl.sh') }}
        restore-keys: |
          source-packages-v1-
          
    - name: Pre-download sources with mirrors
      run: |
        echo "📥 Скачиваем исходники с использованием зеркал..."
        
        # Создаём директорию для кеша исходников
        mkdir -p ~/source_cache
        cd ~/source_cache
        
        # Функция для скачивания с зеркалами
        download_with_mirrors() {
          local filename=$1
          local primary_url=$2
          local mirror_urls=("${@:3}")
          
          if [ -f "$filename" ]; then
            echo "✅ $filename уже скачан"
            return 0
          fi
          
          echo "⬇️ Скачиваем $filename..."
          
          # Пробуем основной URL
          if wget -O "$filename.tmp" "$primary_url" 2>/dev/null; then
            mv "$filename.tmp" "$filename"
            echo "✅ Скачано с основного источника: $primary_url"
            return 0
          fi
          
          # Пробуем зеркала
          for mirror_url in "${mirror_urls[@]}"; do
            echo "🔄 Пробуем зеркало: $mirror_url"
            if wget -O "$filename.tmp" "$mirror_url" 2>/dev/null; then
              mv "$filename.tmp" "$filename"
              echo "✅ Скачано с зеркала: $mirror_url"
              return 0
            fi
          done
          
          echo "❌ Не удалось скачать $filename"
          rm -f "$filename.tmp"
          return 1
        }
        
        # Скачиваем OpenSSL с зеркалами
        download_with_mirrors "openssl-3.5.0.tar.gz" \
          "https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz" \
          "https://www.openssl.org/source/openssl-3.5.0.tar.gz" \
          "https://ftp.openssl.org/source/openssl-3.5.0.tar.gz" \
          "https://mirror.yandex.ru/pub/OpenSSL/openssl-3.5.0.tar.gz"
        
        # Скачиваем libssh с зеркалами
        download_with_mirrors "libssh-0.11.2.tar.xz" \
          "https://www.libssh.org/files/0.11/libssh-0.11.2.tar.xz" \
          "https://git.libssh.org/projects/libssh.git/snapshot/libssh-0.11.2.tar.xz" \
          "https://mirror.yandex.ru/debian/pool/main/libs/libssh/libssh_0.11.2.orig.tar.xz"
        
        echo "✅ Исходники загружены в кеш"
        ls -la ~/source_cache/
        
    - name: Build OpenSSL and libssh for ${{ matrix.arch }}
      run: |
        chmod +x ./build_openssl.sh
        export ANDROID_ABI=${{ matrix.arch }}
        export SOURCE_CACHE_DIR="$HOME/source_cache"
        ./build_openssl.sh
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build ${{ matrix.build_type }} APK for ${{ matrix.arch }}
      working-directory: ssh-tunnel-android-app
      run: |
        if [ "${{ matrix.build_type }}" == "debug" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          ./gradlew assembleRelease --no-daemon --stacktrace
        fi
        
    - name: Run tests
      working-directory: ssh-tunnel-android-app
      run: ./gradlew test --no-daemon --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nightly-${{ matrix.build_type }}-${{ matrix.arch }}
        path: ssh-tunnel-android-app/app/build/outputs/apk/${{ matrix.build_type }}/app-${{ matrix.build_type }}.apk
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.build_type }}-${{ matrix.arch }}
        path: ssh-tunnel-android-app/app/build/test-results/

  create-nightly-release:
    needs: nightly-build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: nightly-*
        merge-multiple: false
        
    - name: Create nightly tag
      run: |
        DATE=$(date +'%Y%m%d')
        echo "NIGHTLY_TAG=nightly-$DATE" >> $GITHUB_ENV
        
    - name: Delete previous nightly release
      run: |
        gh release delete nightly-latest --yes || true
        git tag -d nightly-latest || true
        git push origin :refs/tags/nightly-latest || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create nightly release
      run: |
        DATE=$(date +'%Y-%m-%d %H:%M UTC')
        
        gh release create nightly-latest \
          --title "Nightly Build - $DATE" \
          --notes "🌙 **Nightly Build** - $DATE
        
        This is an automated nightly build containing the latest changes.
        
        **⚠️ Warning**: Nightly builds are unstable and for testing purposes only.
        
        **Included builds**:
        - Debug APKs for arm64-v8a and armeabi-v7a
        - Release APKs for arm64-v8a and armeabi-v7a
        
        **Installation**: Enable 'Unknown sources' and install the appropriate APK for your device architecture." \
          --prerelease \
          nightly-*/app-*.apk
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: [nightly-build, create-nightly-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.artifacts.filter(artifact => {
            const ageInDays = (Date.now() - new Date(artifact.created_at)) / (1000 * 60 * 60 * 24);
            return ageInDays > 7; // Удаляем артефакты старше 7 дней
          });
          
          for (const artifact of oldArtifacts) {
            console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id
            });
          }
          
          console.log(`Deleted ${oldArtifacts.length} old artifacts`);

  notify:
    needs: [nightly-build, create-nightly-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify build status
      run: |
        if [ "${{ needs.nightly-build.result }}" == "success" ] && [ "${{ needs.create-nightly-release.result }}" == "success" ]; then
          echo "✅ Nightly build completed successfully"
          echo "🚀 Release available at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly-latest"
        else
          echo "❌ Nightly build failed"
          echo "🔍 Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
