name: Build and Release Android App

on:
  push:
    branches: [ main, openssl ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config
        sudo apt-get install -y autotools-dev autoconf automake libtool
        
    - name: Install Android SDK
      run: |
        chmod +x ./install_android_sdk.sh
        ./install_android_sdk.sh
        
    - name: Build OpenSSL for ${{ matrix.arch }}
      run: |
        chmod +x ./build_openssl.sh
        ANDROID_ABI=${{ matrix.arch }} ./build_openssl.sh
        
    - name: Build libssh for ${{ matrix.arch }}
      run: |
        chmod +x ./build_libssh_openssl.sh
        ANDROID_ABI=${{ matrix.arch }} ./build_libssh_openssl.sh
        
    - name: Upload prebuilt libraries
      uses: actions/upload-artifact@v4
      with:
        name: prebuilt-libs-${{ matrix.arch }}
        path: |
          ssh-tunnel-android-app/app/src/main/prebuilt/
        retention-days: 1

  build-android:
    needs: build-dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 26.3.11579264
        
    - name: Download prebuilt libraries
      uses: actions/download-artifact@v4
      with:
        pattern: prebuilt-libs-*
        merge-multiple: true
        path: ssh-tunnel-android-app/app/src/main/prebuilt/
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Debug APK
      working-directory: ssh-tunnel-android-app
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Build Release APK
      working-directory: ssh-tunnel-android-app
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      
    - name: Sign Release APK
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: ssh-tunnel-android-app
      run: |
        # Create keystore if it doesn't exist (for demo purposes)
        if [ ! -f app/release-key.jks ]; then
          keytool -genkey -v -keystore app/release-key.jks -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
        fi
        
        # Sign the APK
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks app/release-key.jks \
          --ks-key-alias release \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out app/build/outputs/apk/release/app-release-signed.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk
          
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ssh-tunnel-android-app/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: ssh-tunnel-android-app/app/build/outputs/apk/release/app-release-signed.apk

  test:
    needs: build-android
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: .
        
    - name: Test APK installation
      run: |
        chmod +x ./test_apk.sh
        ./test_apk.sh app-debug.apk || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: .
        
    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: .
        
    - name: Generate release notes
      id: release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "# SSH Tunnel Android App ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Changes in this release:" >> $GITHUB_OUTPUT
        echo "- Android UDP bridge with SSH tunnel support" >> $GITHUB_OUTPUT
        echo "- OpenSSL/mbedTLS crypto backend" >> $GITHUB_OUTPUT
        echo "- Support for password and key authentication" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Downloads:" >> $GITHUB_OUTPUT
        echo "- **app-release-signed.apk** - Production release (recommended)" >> $GITHUB_OUTPUT
        echo "- **app-debug.apk** - Debug version with logging" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Installation:" >> $GITHUB_OUTPUT
        echo "1. Enable 'Unknown sources' in Android settings" >> $GITHUB_OUTPUT
        echo "2. Download and install the APK" >> $GITHUB_OUTPUT
        echo "3. Grant necessary permissions" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        files: |
          app-release-signed.apk
          app-debug.apk
        draft: false
        prerelease: false
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-info:
    runs-on: ubuntu-latest
    steps:
    - name: Build Information
      run: |
        echo "🏗️ Build Information"
        echo "===================="
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
        echo "Event: ${{ github.event_name }}"
        echo "Workflow: ${{ github.workflow }}"
        echo "Job: ${{ github.job }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "Run Number: ${{ github.run_number }}"
