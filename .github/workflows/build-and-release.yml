name: Build and Release Android App


on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout code (no submodules to allow optional fetch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load CI variables
        run: |
          if [ -f .github/ci/ci-vars.sh ]; then
            source .github/ci/ci-vars.sh
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION" >> $GITHUB_ENV
            echo "ANDROID_BUILD_TOOLS_VERSION=$ANDROID_BUILD_TOOLS_VERSION" >> $GITHUB_ENV
          else
            echo "CI vars file missing" && exit 1
          fi

      - name: Fetch udp2tcp submodule (required)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching udp2tcp submodule (required)..."
          set -e
          # Use token-based URL if available to avoid interactive auth on private fork
          URL="https://github.com/dobord/udp2tcp.git"
          if [ -n "$GITHUB_TOKEN" ]; then
            URL="https://${GITHUB_TOKEN}:x-oauth-basic@github.com/dobord/udp2tcp.git"
          fi
          # If submodule entry exists but clone failed earlier, clear directory
          rm -rf third_party/udp2tcp
          git submodule deinit -f third_party/udp2tcp 2>/dev/null || true
          git config submodule.third_party/udp2tcp.url "$URL"
          attempts=0
          until [ $attempts -ge 3 ]; do
            if git submodule update --init --depth 1 third_party/udp2tcp; then
              break
            fi
            attempts=$((attempts+1))
            echo "Retry $attempts..."; sleep 2
          done
          if [ ! -d third_party/udp2tcp/include ]; then
            echo "❌ Required udp2tcp headers missing after retries." >&2
            exit 1
          fi
          echo "✅ udp2tcp present: $(git -C third_party/udp2tcp log --oneline -1 | head -1 || true)"
          if [ -d third_party/udp2tcp/third_party/libcoro/.git ]; then
            echo "libcoro: $(git -C third_party/udp2tcp/third_party/libcoro log --oneline -1 | head -1 || true)"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK and Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${ANDROID_NDK_VERSION}" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" || true

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
          sudo apt-get install -y autotools-dev autoconf automake libtool
          sudo apt-get install -y perl wget curl unzip util-linux
          echo "✅ Required packages installed including util-linux (flock)"

      - name: Setup Android NDK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "Checking toolchain availability for ${{ matrix.arch }}..."
          ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -10
          case "${{ matrix.arch }}" in
            arm64-v8a)
              ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang* || true ;;
            armeabi-v7a)
              ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi*-clang* || true ;;
            x86)
              ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android*-clang* || true ;;
            x86_64)
              ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android*-clang* || true ;;
          esac

      - name: Setup Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Validate build environment for ${{ matrix.arch }}
        run: |
          echo "🔍 Validating build environment for ${{ matrix.arch }}"
          echo "NDK_PATH: $ANDROID_NDK_HOME"
          echo "ANDROID_ABI: ${{ matrix.arch }}"
          which perl
          which cmake
          which make
          which flock
          perl --version | head -2
          cmake --version | head -1
          make --version | head -1
          echo "flock version: $(flock --version 2>&1 | head -1)"

      - name: Cache source packages
        uses: actions/cache@v4
        with:
          path: |
            ~/source_cache
          key: source-packages-v1-${{ hashFiles('build_openssl.sh') }}
          restore-keys: |
            source-packages-v1-

      - name: Pre-download sources with mirrors
        run: |
          echo "📥 Downloading sources using mirrors..."
          mkdir -p ~/source_cache
          cd ~/source_cache
          download_with_mirrors() {
            local filename=$1
            local primary_url=$2
            shift 2
            local mirror_urls=("$@")
            if [ -f "$filename" ]; then
              echo "✅ $filename already downloaded"
              return 0
            fi
            echo "⬇️ Downloading $filename..."
            if wget -O "$filename.tmp" "$primary_url" 2>/dev/null; then
              mv "$filename.tmp" "$filename"
              echo "✅ Downloaded from primary source: $primary_url"
              return 0
            fi
            for mirror_url in "${mirror_urls[@]}"; do
              echo "🔄 Trying mirror: $mirror_url"
              if wget -O "$filename.tmp" "$mirror_url" 2>/dev/null; then
                mv "$filename.tmp" "$filename"
                echo "✅ Downloaded from mirror: $mirror_url"
                return 0
              fi
            done
            echo "❌ Failed to download $filename"
            rm -f "$filename.tmp"
            return 1
          }
          download_with_mirrors "openssl-3.5.0.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz" \
            "https://www.openssl.org/source/openssl-3.5.0.tar.gz" \
            "https://ftp.openssl.org/source/openssl-3.5.0.tar.gz" \
            "https://mirror.yandex.ru/pub/OpenSSL/openssl-3.5.0.tar.gz"
          download_with_mirrors "libssh-0.11.2.tar.xz" \
            "https://www.libssh.org/files/0.11/libssh-0.11.2.tar.xz" \
            "https://git.libssh.org/projects/libssh.git/snapshot/libssh-0.11.2.tar.xz" \
            "https://github.com/search?q=libssh-0.11.2.tar.xz&type=code" \
            "https://mirror.yandex.ru/debian/pool/main/libs/libssh/libssh_0.11.2.orig.tar.xz"
          echo "✅ Sources cached"
          ls -la ~/source_cache/

      - name: Build OpenSSL and libssh for ${{ matrix.arch }}
        run: |
          chmod +x ./build_openssl.sh
          export ANDROID_ABI=${{ matrix.arch }}
          export SOURCE_CACHE_DIR="$HOME/source_cache"
          export ARCH_WORK_DIR="$(pwd)/build_${{ matrix.arch }}"
          mkdir -p "$ARCH_WORK_DIR"
          echo "🚀 Starting build for architecture: ${{ matrix.arch }}"
          echo "📁 Working directory: $ARCH_WORK_DIR"
          echo "📦 Source cache: $SOURCE_CACHE_DIR"
          export USE_FILE_LOCKS=1
          ./build_openssl.sh

      - name: Validate build results for ${{ matrix.arch }}
        run: |
          echo "🔍 Checking build results for ${{ matrix.arch }}"
          PREBUILT_DIR="ssh-tunnel-android-app/app/src/main/prebuilt"
          sleep $((RANDOM % 5 + 1))
          if [ -f "$PREBUILT_DIR/openssl/${{ matrix.arch }}/lib/libssl.a" ] && [ -f "$PREBUILT_DIR/openssl/${{ matrix.arch }}/lib/libcrypto.a" ]; then
            echo "✅ OpenSSL libraries for ${{ matrix.arch }} built successfully"
            ls -la "$PREBUILT_DIR/openssl/${{ matrix.arch }}/lib/"
          else
            echo "❌ OpenSSL libraries for ${{ matrix.arch }} not found"
            echo "Checking directory structure..."
            find "$PREBUILT_DIR/openssl/${{ matrix.arch }}/" -type f 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          if [ -f "$PREBUILT_DIR/libssh/${{ matrix.arch }}/lib/libssh.a" ]; then
            echo "✅ libssh library for ${{ matrix.arch }} built successfully"
            ls -la "$PREBUILT_DIR/libssh/${{ matrix.arch }}/lib/"
          else
            echo "❌ libssh library for ${{ matrix.arch }} not found"
            echo "Checking directory structure..."
            find "$PREBUILT_DIR/libssh/${{ matrix.arch }}/" -type f 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "📊 Library sizes for ${{ matrix.arch }}:"
          du -h "$PREBUILT_DIR/openssl/${{ matrix.arch }}/lib/"*.a
          du -h "$PREBUILT_DIR/libssh/${{ matrix.arch }}/lib/"*.a

      - name: Upload prebuilt libraries
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-libs-${{ matrix.arch }}
          path: |
            ssh-tunnel-android-app/app/src/main/prebuilt/openssl/${{ matrix.arch }}/
            ssh-tunnel-android-app/app/src/main/prebuilt/libssh/${{ matrix.arch }}/
          retention-days: 1

  build-android:
    needs: build-dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, force-on]
    steps:
      - name: Checkout code (no submodules to allow optional fetch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load CI variables
        run: |
          if [ -f .github/ci/ci-vars.sh ]; then
            source .github/ci/ci-vars.sh
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION" >> $GITHUB_ENV
            echo "ANDROID_BUILD_TOOLS_VERSION=$ANDROID_BUILD_TOOLS_VERSION" >> $GITHUB_ENV
          else
            echo "CI vars file missing" && exit 1
          fi

      - name: Fetch udp2tcp submodule (required)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching udp2tcp submodule (required)..."
          set -e
          # Use token-based URL if available to avoid interactive auth on private fork
          URL="https://github.com/dobord/udp2tcp.git"
          if [ -n "$GITHUB_TOKEN" ]; then
            URL="https://${GITHUB_TOKEN}:x-oauth-basic@github.com/dobord/udp2tcp.git"
          fi
          # If submodule entry exists but clone failed earlier, clear directory
          rm -rf third_party/udp2tcp
          git submodule deinit -f third_party/udp2tcp 2>/dev/null || true
          git config submodule.third_party/udp2tcp.url "$URL"
          attempts=0
          until [ $attempts -ge 3 ]; do
            if git submodule update --init --depth 1 third_party/udp2tcp; then
              break
            fi
            attempts=$((attempts+1))
            echo "Retry $attempts..."; sleep 2
          done
          if [ ! -d third_party/udp2tcp/include ]; then
            echo "❌ Required udp2tcp headers missing after retries." >&2
            exit 1
          fi
          echo "✅ udp2tcp present: $(git -C third_party/udp2tcp log --oneline -1 | head -1 || true)"
          if [ -d third_party/udp2tcp/third_party/libcoro/.git ]; then
            echo "libcoro: $(git -C third_party/udp2tcp/third_party/libcoro log --oneline -1 | head -1 || true)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK and Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true

      - name: Download prebuilt libraries
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-libs-*
          merge-multiple: true
          path: ssh-tunnel-android-app/app/src/main/prebuilt/

      - name: Verify downloaded libraries structure
        run: |
          echo "🔍 Checking downloaded libraries structure..."
          find ssh-tunnel-android-app/app/src/main/prebuilt/ -name "*.a" -o -name "*.so" | sort
          echo "📊 Library sizes by architecture:"
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            if [ -d "ssh-tunnel-android-app/app/src/main/prebuilt/openssl/$arch" ]; then
              echo "📁 $arch OpenSSL:"
              du -h ssh-tunnel-android-app/app/src/main/prebuilt/openssl/$arch/lib/*.a 2>/dev/null || echo "   No .a files"
            fi
            if [ -d "ssh-tunnel-android-app/app/src/main/prebuilt/libssh/$arch" ]; then
              echo "📁 $arch libssh:"
              du -h ssh-tunnel-android-app/app/src/main/prebuilt/libssh/$arch/lib/*.a 2>/dev/null || echo "   No .a files"
            fi
          done

      - name: Make gradlew executable
        run: chmod +x ssh-tunnel-android-app/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ssh-tunnel-android-app
        run: |
          echo "Selected udp2tcp mode: ${{ matrix.mode }}"
          case "${{ matrix.mode }}" in
            force-on)
              CMAKE_ARGS="" # force-on retained for naming consistency; build always uses udp2tcp now
              ;;
            auto)
              CMAKE_ARGS=""
              ;;
          esac
          ./gradlew assembleDebug --no-daemon --stacktrace $CMAKE_ARGS

      - name: Build Release APK
        working-directory: ssh-tunnel-android-app
        if: ${{ matrix.mode == 'auto' }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ssh-tunnel-android-app
        run: |
          if [ ! -f app/release-key.jks ]; then
            keytool -genkey -v -keystore app/release-key.jks -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks app/release-key.jks \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ matrix.mode }}
          path: ssh-tunnel-android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/') && matrix.mode == 'auto'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ssh-tunnel-android-app/app/build/outputs/apk/release/app-release-signed.apk

  test:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Debug APK (auto mode)
        uses: actions/download-artifact@v4
        with:
          name: app-debug-auto
          path: .
      - name: Test APK installation
        run: |
          chmod +x ./test_apk.sh
          ./test_apk.sh app-debug.apk || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: .

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-auto
          path: .

      - name: Generate release notes
        id: release_notes
        run: |
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "# SSH Tunnel Android App ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Changes in this release:" >> $GITHUB_OUTPUT
          echo "- Android UDP bridge with SSH tunnel support" >> $GITHUB_OUTPUT
          echo "- OpenSSL crypto backend" >> $GITHUB_OUTPUT
          echo "- Support for password and key authentication" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Downloads:" >> $GITHUB_OUTPUT
          echo "- **app-release-signed.apk** - Production release (recommended)" >> $GITHUB_OUTPUT
          echo "- **app-debug.apk** - Debug version with logging" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Installation:" >> $GITHUB_OUTPUT
          echo "1. Enable 'Unknown sources' in Android settings" >> $GITHUB_OUTPUT
          echo "2. Download and install the APK" >> $GITHUB_OUTPUT
          echo "3. Grant necessary permissions" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          files: |
            app-release-signed.apk
            app-debug.apk
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-info:
    runs-on: ubuntu-latest
    steps:
      - name: Build Information
        run: |
          echo "🏗️ Build Information"
          echo "===================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
