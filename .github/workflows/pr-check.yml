name: Pull Request Check

on:
  pull_request_target:
    branches: [ main, openssl ]
    paths:
      - 'ssh-tunnel-android-app/**'
      - '.github/workflows/**'
      - '*.sh'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Run Gradle checks
      working-directory: ssh-tunnel-android-app
      run: |
        ./gradlew check --no-daemon --stacktrace
        ./gradlew lint --no-daemon --stacktrace
        
    - name: Upload lint results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-results
        path: ssh-tunnel-android-app/app/build/reports/lint-results*.html
        
    - name: Comment PR with lint results
      if: always() && github.event_name == 'pull_request_target'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const lintDir = 'ssh-tunnel-android-app/app/build/reports/';
            const files = fs.readdirSync(lintDir);
            const lintFiles = files.filter(f => f.startsWith('lint-results'));
            
            let comment = '## 🔍 Lint Results\n\n';
            
            if (lintFiles.length > 0) {
              comment += `Found ${lintFiles.length} lint report(s). Check the artifacts for detailed results.\n`;
            } else {
              comment += '✅ No lint issues found!\n';
            }
            
            comment += '\n📊 **Build Status**: ${{ job.status }}\n';
            comment += '🏗️ **Workflow**: ${{ github.workflow }}\n';
            comment += '🔗 **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Error reading lint results:', error);
          }

  quick-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with mock libraries (quick check)
      working-directory: ssh-tunnel-android-app
      run: |
        # Remove prebuilt libs to force mock build
        echo "🗑️ Removing prebuilt libraries to force mock build..."
        rm -rf app/src/main/prebuilt/
        
        # Clean CMake cache to avoid stale references
        echo "🧹 Cleaning CMake cache and build directories..."
        rm -rf app/.cxx/
        rm -rf app/build/intermediates/cxx/
        
        # Clean gradle build cache
        echo "🧹 Cleaning Gradle build cache..."
        ./gradlew clean --no-daemon
        
        # Verify mock files exist
        echo "🔍 Checking mock implementation files..."
        ls -la app/src/main/jni/libssh_mock.*
        
        # Verify main source file exists
        echo "🔍 Checking main source files..."
        ls -la app/src/main/jni/ssh_tunnel.c
        ls -la app/src/main/cpp/CMakeLists.txt
        
        # Show CMakeLists.txt structure 
        echo "📋 CMakeLists.txt content (first 30 lines):"
        head -30 app/src/main/cpp/CMakeLists.txt
        
        # Create simplified CMakeLists.txt for mock build
        echo "🔧 Creating simplified CMakeLists.txt for mock build..."
        cp app/src/main/cpp/CMakeLists.txt app/src/main/cpp/CMakeLists.txt.backup
        
        # Write simplified CMakeLists.txt
        cat > app/src/main/cpp/CMakeLists.txt << 'EOFCMAKE'
        cmake_minimum_required(VERSION 3.18.1)
        project("sshtunnel")
        message(STATUS "Building with mock libssh implementation")
        add_library(ssh STATIC ../jni/libssh_mock.c)
        target_include_directories(ssh PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/../jni)
        add_library(ssh_tunnel SHARED ../jni/ssh_tunnel.c)
        target_compile_definitions(ssh_tunnel PRIVATE USE_LIBSSH_MOCK=1)
        target_include_directories(ssh_tunnel PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/../jni)
        find_library(log-lib log)
        target_link_libraries(ssh_tunnel ssh ${log-lib})
        target_compile_options(ssh_tunnel PRIVATE -Wall -Wextra)
        target_link_options(ssh_tunnel PRIVATE -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384)
        EOFCMAKE
        
        echo "✅ Simplified CMakeLists.txt created for mock build"
        
        # Temporarily enable only one ABI for quick mock build
        echo "📱 Temporarily setting single ABI for quick mock build..."
        cp app/build.gradle app/build.gradle.backup
        sed -i 's/abiFilters "arm64-v8a"/abiFilters "arm64-v8a"/' app/build.gradle
        
        # Show updated ABI filters
        echo "📱 Updated ABI filters in build.gradle:"
        grep -A5 -B5 "abiFilters" app/build.gradle || echo "No abiFilters found"
        
        # Build with mock (should use libssh_mock.c)
        echo "🔨 Starting Gradle build with mock libraries..."
        
        # Try to get more detailed ninja output
        export NINJA_STATUS="[%f/%t] "
        export CMAKE_VERBOSE_MAKEFILE=ON
        
        ./gradlew assembleDebug --no-daemon --stacktrace --debug 2>&1 | tee build.log
        
        # Check for ninja/cmake errors first
        echo "🔍 Checking for CMake/ninja errors..."
        if grep -A10 -B10 "ninja.*finished with non-zero exit value" build.log; then
          echo "❌ Ninja build failed!"
          echo "📋 CMake output:"
          grep -A20 -B20 "CMAKE" build.log | tail -50
          echo "📋 Ninja output:"
          grep -A20 -B20 "ninja" build.log | tail -50
        fi
        
        # Check CMake messages for mock usage
        echo "🔍 Checking CMake messages for mock library detection..."
        if grep -q "Falling back to mock implementation" build.log; then
          echo "✅ CMake correctly detected missing libraries and fell back to mock"
        elif grep -q "libssh_mock.c" build.log; then
          echo "✅ CMake is building with mock implementation"
        else
          echo "⚠️ Could not confirm mock library usage from build log"
          echo "📋 CMake related messages:"
          grep -i "cmake\|mock\|libssh\|prebuilt" build.log | head -20 || echo "No relevant messages found"
        fi
        
        # Restore original build.gradle
        mv app/build.gradle.backup app/build.gradle
        
        # Restore original CMakeLists.txt
        mv app/src/main/cpp/CMakeLists.txt.backup app/src/main/cpp/CMakeLists.txt
        
        # Check if build succeeded
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ Mock build successful!"
          ls -la app/build/outputs/apk/debug/app-debug.apk
          
          # Show APK info
          echo "📦 APK info:"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "\.so" || echo "No native libraries found"
        else
          echo "❌ Mock build failed!"
          echo "📋 Last 50 lines of build log:"
          tail -50 build.log
          exit 1
        fi
        
    - name: Upload quick build APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pr-quick-build
        path: ssh-tunnel-android-app/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
