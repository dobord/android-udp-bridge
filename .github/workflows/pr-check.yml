name: Pull Request Check

on:
  pull_request_target:
    branches: [ main, develop ]
    paths:
      - 'ssh-tunnel-android-app/**'
      - '.github/workflows/**'
      - '*.sh'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Run Gradle checks
      working-directory: ssh-tunnel-android-app
      run: |
        ./gradlew check --no-daemon --stacktrace
        ./gradlew lint --no-daemon --stacktrace
        
    - name: Upload lint results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-results
        path: ssh-tunnel-android-app/app/build/reports/lint-results*.html
        
    - name: Comment PR with lint results
      if: always() && github.event_name == 'pull_request_target'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const lintDir = 'ssh-tunnel-android-app/app/build/reports/';
            const files = fs.readdirSync(lintDir);
            const lintFiles = files.filter(f => f.startsWith('lint-results'));
            
            let comment = '## 🔍 Lint Results\n\n';
            
            if (lintFiles.length > 0) {
              comment += `Found ${lintFiles.length} lint report(s). Check the artifacts for detailed results.\n`;
            } else {
              comment += '✅ No lint issues found!\n';
            }
            
            comment += '\n📊 **Build Status**: ${{ job.status }}\n';
            comment += '🏗️ **Workflow**: ${{ github.workflow }}\n';
            comment += '🔗 **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Error reading lint results:', error);
          }

  quick-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Setup Android NDK and Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
    - name: Make gradlew executable
      run: chmod +x ssh-tunnel-android-app/gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build (mock or udp2tcp quick check)
      working-directory: ssh-tunnel-android-app
      shell: bash
      run: |
        set -e
        echo "[quick-build] Start"
        rm -rf app/src/main/prebuilt/ app/.cxx/ app/build/intermediates/cxx/
        ./gradlew clean --no-daemon || true
        if [ -d ../third_party/udp2tcp ]; then
          echo "udp2tcp detected (migration mode)"; LEGACY_MODE=0
        else
          LEGACY_MODE=1
        fi
        if [ "$LEGACY_MODE" = 1 ]; then
          for f in udp_listener.c tcp_connection_manager.c client_manager.c udp_bridge_protocol.c; do
            test -f app/src/main/jni/$f || { echo "Missing legacy source: $f"; exit 1; }
          done
        else
          echo "Skipping legacy file checks"
        fi
        cp app/build.gradle app/build.gradle.backup
        sed -i 's/abiFilters ".*"/abiFilters "arm64-v8a"/' app/build.gradle || true
        ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
        mv app/build.gradle.backup app/build.gradle
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "[quick-build] Success"; unzip -l app/build/outputs/apk/debug/app-debug.apk | grep '\.so' || true
        else
          echo "[quick-build] Failed"; tail -50 build.log; exit 1
        fi
        echo "[quick-build] End"
        
    - name: Upload quick build APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pr-quick-build
        path: ssh-tunnel-android-app/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
